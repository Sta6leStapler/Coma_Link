<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>新規募集作成 | Coma-Link</title>
  <style>
    :root { --bg: #f5f5f5; --fg: #333; --panel: #fff; --border: #ddd; --primary: #2196f3; --overlay: rgba(0,0,0,0.3); }
    html[data-theme="dark"] { --bg:#2b2b2b; --fg:#ddd; --panel:#3b3b3b; --border:#555; --primary:#1976d2; --overlay:rgba(0,0,0,0.5); }
    body { margin:0; font-family:Arial,sans-serif; background:var(--bg); color:var(--fg); }
    header { background:var(--panel); padding:10px; display:flex; justify-content:space-between; border-bottom:1px solid var(--border); }
    header button { background:var(--panel); color:var(--fg); border:1px solid var(--border); border-radius:4px; padding:4px 8px; font-size:16px; cursor:pointer; }
    main { padding:20px; max-width:500px; margin:20px auto; background:var(--panel); border-radius:8px; box-shadow:0 2px 6px var(--overlay); }
    h2 { margin-top:0; text-align:center; }
    .form-group { margin-bottom:15px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 14px; }
    .form-group input, .form-group select { width:100%; padding:8px; font-size:14px; border:1px solid var(--border); border-radius:4px; background:var(--bg); color:var(--fg); box-sizing: border-box;}
    .form-group button { width:100%; padding:10px; font-size:16px; background:var(--primary); color:white; border:none; border-radius:4px; cursor:pointer; }
    .date-preview { font-size: 0.9em; color: var(--primary); text-align: right; margin-top: 5px; font-weight: bold; }
    .preset-btn { font-size: 0.9em; padding: 6px 10px; border: 1px solid var(--border); background: var(--bg); border-radius: 15px; cursor: pointer; color: var(--fg); transition: 0.2s; }
    .preset-btn:hover { background: var(--border); }
  </style>
</head>
<body>
  <header>
    <button onclick="location.href='board.html'">← 掲示板に戻る</button>
  </header>

  <main>
    <h2>新しい募集を作成</h2>
    
    <div class="form-group" id="preset-buttons" style="display:flex; gap:5px; flex-wrap:wrap; margin-bottom:20px;"></div>

    <div class="form-group">
      <label>タイトル *</label>
      <input type="text" id="title" placeholder="例：一緒にランチしませんか？">
    </div>

    <div class="form-group" style="display:flex; gap:10px;">
      <div style="flex:1;">
        <label>いつ</label>
        <select id="weekOffset" onchange="updateDatePreview()">
          <option value="0">今週</option>
          <option value="1">来週</option>
          <option value="2">再来週</option>
          <option value="3">3週間後</option>
        </select>
      </div>
      <div style="flex:1;">
        <label>曜日 *</label>
        <select id="day" onchange="updateDatePreview(); updateFreeUsers();"></select>
      </div>
    </div>
    <div id="datePreview" class="date-preview"></div>

    <div class="form-group" style="display:flex; gap:10px;">
      <div style="flex:1;">
        <label>開始コマ *</label>
        <select id="start_slot" onchange="updateFreeUsers()"></select>
      </div>
      <div style="flex:1;">
        <label>終了コマ</label>
        <select id="end_slot" onchange="updateFreeUsers()"></select>
      </div>
    </div>
    
    <div class="form-group">
      <label>カテゴリ</label>
      <select id="categorySelect" onchange="toggleCategoryInput()"></select>
      <input type="text" id="categoryInput" placeholder="カテゴリ名を入力" style="display:none; margin-top:5px;">
    </div>
    
    <div class="form-group">
      <label>場所</label>
      <input type="text" id="location" placeholder="例: 学食">
    </div>
    <div class="form-group">
      <label>最大参加人数</label>
      <input type="number" id="max_participants" value="2" min="1" max="20">
    </div>

    <div class="form-group" style="text-align:center; color:var(--primary); font-weight:bold;">
      <span id="freeUserDisplay">この時間の空きユーザー: 計算中...</span>
    </div>
    <div class="form-group">
      <button id="createBtn" onclick="createRecruitment()">募集を作成</button>
    </div>
  </main>
  
  <script>
    const API = 'https://coma-link.onrender.com';
    const user = localStorage.getItem('coma_user');
    if (!user) { alert('ログインしてください'); location.href = 'index.html'; }

    // --- 曜日初期化 ---
    const daySelect = document.getElementById('day');
    const DAYS = ['月', '火', '水', '木', '金'];
    DAYS.forEach(d => { daySelect.add(new Option(d + '曜日', d)); });

    // --- コマ初期化 (昼休み対応) ---
    const startSlotSelect = document.getElementById('start_slot');
    const endSlotSelect = document.getElementById('end_slot');

    function getSlotLabel(i) {
        if (i === 3) return '昼休み';
        if (i < 3) return `${i}限`;
        return `${i - 1}限`;
    }

    for (let i = 1; i <= 8; i++) {
        const label = getSlotLabel(i);
        startSlotSelect.add(new Option(label, i));
        endSlotSelect.add(new Option(label, i));
    }

    // --- カテゴリ初期化 (趣味・その他対応) ---
    const CATEGORY_SETTINGS = {
        "食事": {"icon": "🍱", "title": "ランチに行きませんか？"},
        "勉強": {"icon": "📖", "title": "課題一緒にやりましょう"},
        "スポーツ": {"icon": "⚽", "title": "スポーツしましょう"},
        "雑談": {"icon": "💬", "title": "空きコマ雑談"},
        "趣味": {"icon": "🎮", "title": "ゲームしませんか？"},
        "その他": {"icon": "✨", "title": ""}
    };

    const catSelect = document.getElementById('categorySelect');
    Object.keys(CATEGORY_SETTINGS).forEach(cat => { catSelect.add(new Option(cat, cat)); });

    function toggleCategoryInput() {
        const val = document.getElementById('categorySelect').value;
        const input = document.getElementById('categoryInput');
        if (val === 'その他') {
            input.style.display = 'block'; input.value = ''; input.focus();
        } else {
            input.style.display = 'none';
            if (CATEGORY_SETTINGS[val]?.title) document.getElementById('title').value = CATEGORY_SETTINGS[val].title;
        }
    }
    toggleCategoryInput();

    // プリセットボタン生成
    const presetContainer = document.getElementById('preset-buttons');
    Object.entries(CATEGORY_SETTINGS).forEach(([cat, data]) => {
        const btn = document.createElement('button');
        btn.className = 'preset-btn';
        btn.textContent = `${data.icon} ${cat}`;
        btn.onclick = () => { document.getElementById('categorySelect').value = cat; toggleCategoryInput(); };
        presetContainer.appendChild(btn);
    });

    // --- 日付計算 ---
    let currentWeekStart = new Date();
    const dayNum = currentWeekStart.getDay() || 7; 
    currentWeekStart.setDate(currentWeekStart.getDate() - (dayNum - 1));

    function updateDatePreview() {
        const weekOffset = parseInt(document.getElementById('weekOffset').value);
        const day = document.getElementById('day').value;
        const dayMap = {'月':0, '火':1, '水':2, '木':3, '金':4};
        
        const targetDate = new Date(currentWeekStart);
        targetDate.setDate(targetDate.getDate() + (weekOffset * 7) + dayMap[day]);
        
        const m = targetDate.getMonth() + 1;
        const d = targetDate.getDate();
        document.getElementById('datePreview').textContent = `予定日: ${m}月${d}日 (${day})`;
        return targetDate.toISOString().split('T')[0];
    }

    // --- 空きユーザー計算 ---
    async function updateFreeUsers() {
        const day = document.getElementById('day').value;
        const slot = document.getElementById('start_slot').value;
        const endSlot = document.getElementById('end_slot').value || slot;
        const display = document.getElementById('freeUserDisplay');
        
        if(!day || !slot) return;
        
        display.textContent = "計算中...";
        try {
            const res = await fetch(`${API}/free_users?day=${day}&start_slot=${slot}&end_slot=${endSlot}`);
            if (!res.ok) throw new Error("Server Error");
            const data = await res.json();
            display.textContent = `この期間の空きユーザー: 約 ${data.count} 人`;
        } catch(e) {
            console.error(e);
            display.textContent = "取得失敗";
        }
    }
    
    // --- 初期化 ---
    window.onload = () => {
        const params = new URLSearchParams(window.location.search);
        if(params.get('day')) document.getElementById('day').value = params.get('day');
        if(params.get('start_slot')) {
            document.getElementById('start_slot').value = params.get('start_slot');
            document.getElementById('end_slot').value = params.get('start_slot');
        }
        updateDatePreview();
        updateFreeUsers();
    };

    // --- 募集作成送信 ---
    async function createRecruitment() {
      const title = document.getElementById('title').value.trim();
      const day = document.getElementById('day').value;
      const start_slot = parseInt(document.getElementById('start_slot').value, 10);
      const end_slot = parseInt(document.getElementById('end_slot').value, 10);

      if (!title || !day) { alert('必須項目（*）を入力してください。'); return; }

      const dateStr = updateDatePreview();

      let categoryVal = document.getElementById('categorySelect').value;
      if (categoryVal === 'その他') categoryVal = document.getElementById('categoryInput').value.trim();
      
      const body = {
        creator_username: user, title: title, category: categoryVal,
        location: document.getElementById('location').value.trim(),
        max_participants: parseInt(document.getElementById('max_participants').value, 10),
        date: dateStr, day: day, start_slot: start_slot, end_slot: end_slot,
       };

      const res = await fetch(`${API}/recruitments`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      const data = await res.json();
      if (data.success) { alert('募集を作成しました！'); location.href = 'board.html'; }
      else { alert('作成に失敗しました: ' + data.message); }
    }
  </script>
</body>
</html>
