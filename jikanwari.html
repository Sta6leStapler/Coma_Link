<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>空きコマ ヒートマップ | Coma‑Link</title>
  <style>
    /* mypage.htmlのスタイルを参考にしています */
    :root { --bg: #f9f9f9; --fg: #333; --panel: #fff; --border: #ddd; --highlight: #b2fab4; --primary: #2196f3; }
    html[data-theme="dark"] { --bg: #2b2b2b; --fg: #ddd; --panel: #3b3b3b; --border: #555; --highlight: #4caf50; --primary: #1976d2; }
    body { font-family: Arial, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 0; }
    header { background: var(--panel); padding: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    header h1 { font-size: 1.2em; }
    header button { background: none; border: none; cursor: pointer; font-size: 18px; color: var(--fg); }
    .toolbar { display: flex; background: var(--panel); border-bottom: 1px solid var(--border); }
    .toolbar button { flex: 1; padding: 8px; background: var(--panel); border: none; cursor: pointer; font-size: 14px; }
    .toolbar button.active { background: var(--highlight); color: #fff; }
    main { padding: 20px; }

    /* ▼▼▼ ヒートマップ用スタイル ▼▼▼ */
    .filter-section {
      background: var(--panel); padding: 15px; border-radius: 8px; 
      margin-bottom: 20px; display: flex; gap: 10px; align-items: center;
    }
    .filter-section select, .filter-section input {
      padding: 8px; border: 1px solid var(--border); border-radius: 4px; 
      background-color: var(--bg); color: var(--fg);
    }
    
    .timetable {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed; /* セル幅を均等に */
    }
    .timetable th, .timetable td {
      border: 1px solid var(--border);
      height: 80px; /* コマの高さ */
      text-align: center;
      vertical-align: middle;
      padding: 4px;
      position: relative;
    }
    .timetable th {
      background: var(--panel);
      font-size: 12px;
    }
    /* 授業コマのスタイル */
    .course-cell {
      background-color: var(--border);
      font-size: 14px;
      font-weight: bold;
    }
    /* 空きコマのスタイル */
    .slot-cell {
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .timetable .slot-cell:hover {
      background-color: var(--highlight) !important; /* ホバー色 */
    }
    .slot-count {
      font-size: 24px;
      font-weight: bold;
    }
    #editModeBtn.active {
      background-color: var(--primary) !important;
      color: white;
      font-weight: bold;
    }
    /* ▲▲▲ スタイル ▲▲▲ */
  </style>
</head>
<body>
  <header>
    <h1>Coma‑Link</h1>
    <button id="themeToggle">🌙</button>
  </header>

  <div class="toolbar">
    <button onclick="location.href='jikanwari.html'" class="active">時間割</button>
    <button onclick="location.href='board.html'">募集掲示板</button>
    <button onclick="location.href='calendar.html'">カレンダー</button>
    <button onclick="location.href='connect.html'">つながる</button>
    <button onclick="location.href='chat.html'">チャット</button>
    <button onclick="location.href='mypage.html'">マイページ</button>
  </div>
  <main>
    <h2>空きコマ ヒートマップ</h2>
    
    <div class="filter-section">
      <span>絞り込み:</span>
      <select id="filterGrade">
        <option value="">学年 (すべて)</option>
        <option value="1">1年</option><option value="2">2年</option>
        <option value="3">3年</option><option value="4">4年</option>
      </select>
      <input type="text" id="filterFaculty" placeholder="学部 (例: 工学部)">
      <input type="text" id="filterCircles" placeholder="サークル (例: テニス)">
      <button id="filterBtn">検索</button>
      <button id="filterResetBtn">リセット</button>
      <button id="editModeBtn" style="margin-left: auto; background-color: var(--border);">講義を登録</button>
    </div>

    <table class="timetable" id="heatmapTable">
      <thead>
        <tr>
          <th></th>
        </tr>
      </thead>
      <tbody>
        </tbody>
    </table>

    <div id="courseModal" style="display:none; position:fixed; z-index:100; left:0; top:0; width:100%; height:100%; overflow:auto; background-color:rgba(0,0,0,0.5);">
      <div style="background-color:var(--panel); margin:15% auto; padding:20px; border:1px solid var(--border); border-radius:8px; width:80%; max-width:500px;">
        <h3 id="modalTitle">コマの登録</h3>
        <div style="margin-bottom:15px;">
          <label for="courseContent">授業名 (教室/教員名など)</label>
          <input type="text" id="courseContent" placeholder="例: Web工学 (A-101 / 山田太郎)" style="width:100%; padding:8px; font-size:14px; border:1px solid var(--border); border-radius:4px; background:var(--bg); color:var(--fg); box-sizing: border-box;">
        </div>
        <div style="display:flex; justify-content:space-between;">
          <button id="modalDeleteBtn" style="background-color:#f44336; color:white; padding:10px; border:none; border-radius:4px; cursor:pointer;">削除 (空きコマに戻す)</button>
          <div>
            <button id="modalCancelBtn" style="background-color:var(--border); color:var(--fg); padding:10px; border:none; border-radius:4px; cursor:pointer; margin-right:10px;">キャンセル</button>
            <button id="modalSaveBtn" style="background-color:var(--primary); color:white; padding:10px; border:none; border-radius:4px; cursor:pointer;">保存</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const API = 'http://127.0.0.1:5000';
    const user = localStorage.getItem('coma_user');
    if(!user){ alert('ログインしてください'); location.href='login.html'; }

    const tableBody = document.querySelector('#heatmapTable tbody');
    const days = ['月', '火', '水', '木', '金'];
    const maxPeriod = 7; // PERIOD_TIMES (DB側) と合わせてください

    const periodTimes = {
      1: '09:00-10:30', 2: '10:40-12:10', 3: '13:00-14:30',
      4: '14:40-16:10', 5: '16:15-17:45', 6: '17:50-19:20', 7: '19:30-21:00'
    };
    let currentModalParams = { day: '', slot: 0 }; // モーダル用のグローバル変数
    let isEditMode = false; // 講義登録モード管理用

    let myCourses = {}; // 自分の授業を格納するオブジェクト

    // 自分の授業を読み込む
    async function loadCourses() {
      const res = await fetch(`${API}/courses?username=${encodeURIComponent(user)}`);
      const list = await res.json();
      
      myCourses = {}; // 初期化
      list.forEach(c => {
        const key = `${c.day}-${c.slot}`; // "月-1" のようなキー
        myCourses[key] = c.content; // 授業名
      });
    }

    /**
     * 値に応じてヒートマップの色(HSL)を返す
     * (少: 赤 H:0) -> (中: 黄 H:60) -> (多: 緑 H:120)
     */
    function getHeatmapColor(value, maxValue) {
      if (value === 0 || maxValue === 0) {
        return 'transparent'; // 0件は色なし
      }
      // 募集数を 0% (赤) から 100% (緑) の範囲にマッピング
      const percentage = Math.min(value / maxValue, 1.0);
      // HSLの色相(Hue)を 0 (赤) から 120 (緑) の間で計算
      const hue = percentage * 120;
      
      // 彩度(Saturation)と輝度(Lightness)は固定
      // 募集が少ないほど濃い色にしたい場合は、輝度(lightness)を調整
      const saturation = '90%';
      const lightness = '60%'; // 50%だと濃すぎるため少し明るく
      
      return `hsl(${hue}, ${saturation}, ${lightness})`;
    }

    // ヒートマップデータを取得・描画する関数
    async function loadHeatmap() {
      const params = new URLSearchParams();
      // フィルタ条件を取得
      const grade = document.getElementById('filterGrade').value;
      const faculty = document.getElementById('filterFaculty').value.trim();
      const circles = document.getElementById('filterCircles').value.trim();
      
      if (grade) params.append('grade', grade);
      if (faculty) params.append('faculty', faculty);
      if (circles) params.append('circles', circles);

      const res = await fetch(`${API}/heatmap?${params.toString()}`);
      if (!res.ok) {
        // 404エラー (DB側の/heatmap未実装) など
        console.error("heatmapの読み込みに失敗しました。");
        return;
      }
      const data = await res.json(); // (例: {"月-1": 5, "火-3": 10})

      // 全セルのカウントと色をリセット
      document.querySelectorAll('.slot-cell').forEach(cell => {
        cell.querySelector('.slot-count').textContent = '0';
        cell.style.backgroundColor = 'transparent'; // 色をリセット
      });

      let maxCount = 0;
      Object.values(data).forEach(count => {
        if (count > maxCount) maxCount = count;
      });

      // 取得したデータでセルを更新
      for (const [key, count] of Object.entries(data)) {
        const cell = document.getElementById(`cell-${key}`);
        // 授業がないコマ(cellが存在する) AND 募集が1件以上あるコマのみ更新
        if (cell && count > 0) { 
          cell.querySelector('.slot-count').textContent = count;
          
          // ヒートマップの色付け (赤→黄→緑)
          cell.style.backgroundColor = getHeatmapColor(count, maxCount);
        }
      }
    }

    // フィルタボタンのイベント
    document.getElementById('filterBtn').onclick = loadHeatmap;
    document.getElementById('filterResetBtn').onclick = () => {
      document.getElementById('filterGrade').value = '';
      document.getElementById('filterFaculty').value = '';
      document.getElementById('filterCircles').value = '';
      loadHeatmap();
    };

    // 「講義を登録」ボタンのイベント
    const editModeBtn = document.getElementById('editModeBtn');
    editModeBtn.onclick = () => {
      isEditMode = !isEditMode; // モード切替
      if (isEditMode) {
        editModeBtn.classList.add('active');
        editModeBtn.textContent = '登録モード実行中 (解除)';
        alert('講義登録モードになりました。\n登録・編集したいコマをクリックしてください。');
      } else {
        editModeBtn.classList.remove('active');
        editModeBtn.textContent = '講義を登録';
      }
    };

    // ページ読み込み時に授業とヒートマップを両方読み込む
    async function initializeTimetable() {
      await loadCourses(); // 1. まず自分の授業を読み込む
      
      // 2. 授業情報を元に表を生成
      tableBody.innerHTML = ''; // 表をリセット

      // 曜日ヘッダー(thead)をリセット
      const headerRow = document.querySelector('#heatmapTable thead tr');
      // 既存の曜日ヘッダー (日付) を削除 (最初の1列目「<th></th>」は残す)
      while (headerRow.children.length > 1) {
          headerRow.removeChild(headerRow.lastChild);
      }
      
      const today = new Date();
      const dayMap = {'月':1, '火':2, '水':3, '木':4, '金':5};

      
      days.forEach(day => {
        const th = document.createElement('th');
        const dayOffset = dayMap[day] - today.getDay(); // 今日が月曜(1)で、ターゲットが火曜(2)なら offset=1
        const targetDate = new Date(today);
        targetDate.setDate(today.getDate() + dayOffset);
        
        const dateString = `${targetDate.getMonth() + 1}/${targetDate.getDate()}`;
        th.innerHTML = `${day}<br><small>${dateString}</small>`;
        headerRow.appendChild(th);
      });

      for (let p = 1; p <= maxPeriod; p++) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<th>${p}限<br><small>${periodTimes[p] || ''}</small></th>`; 
        days.forEach(day => {
          const td = document.createElement('td');
          const cellKey = `${day}-${p}`;
          td.id = `cell-${cellKey}`; // IDを "cell-月-1" の形式に

          if (myCourses[cellKey]) {
            // 授業がある場合
            td.className = 'course-cell';
            td.innerHTML = `<span>${myCourses[cellKey].replace(/\n/g, '<br>')}</span>`;
          } else {
            // 空きコマの場合
            td.className = 'slot-cell';
            td.innerHTML = `<span class="slot-count">0</span>`;
          }

          // クリックイベントを統一
          td.onclick = () => {
            if (isEditMode) {
              // 編集モード時：常にモーダルを開く (空きコマでも授業コマでも)
              const currentContent = myCourses[cellKey] || "";
              openCourseModal(day, p, currentContent);
            } else if (!myCourses[cellKey]) {
              // 通常モード時：空きコマなら掲示板へ
              location.href = `board.html?day=${day}&slot=${p}`;
            }
            // 通常モード時：授業コマなら何もしない
          };
          tr.appendChild(td);
        });
        tableBody.appendChild(tr);
      }
      // 3. 最後にヒートマップを読み込む
      await loadHeatmap();
    }

    // モーダルを開く
    function openCourseModal(day, slot, currentContent) {
      currentModalParams = { day, slot }; // 現在のコマを保存
      document.getElementById('modalTitle').textContent = `${day}曜 ${slot}限 の登録`;
      document.getElementById('courseContent').value = currentContent;
      
      // 授業が登録されていなければ「削除」ボタンを隠す
      document.getElementById('modalDeleteBtn').style.display = currentContent ? 'block' : 'none';
      
      document.getElementById('courseModal').style.display = 'block';
    }

    // モーダルを閉じる
    function closeCourseModal() {
      document.getElementById('courseModal').style.display = 'none';
    }

    // 授業を保存 (POST)
    async function saveCourse() {
      const content = document.getElementById('courseContent').value;
      const { day, slot } = currentModalParams;

      const res = await fetch(`${API}/courses`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: user,
          day: day,
          slot: slot,
          content: content
        })
      });
      
      if (res.ok) {
        alert('授業を保存しました');
        closeCourseModal();
        await initializeTimetable(); // 時間割を再描画
      } else {
        alert('保存に失敗しました');
      }
    }
    
    // 授業を削除 (DELETE)
    async function deleteCourse() {
      if (!confirm('このコマを「空きコマ」に戻しますか？')) return;
      
      const { day, slot } = currentModalParams;

      const res = await fetch(`${API}/courses`, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: user,
          day: day,
          slot: slot
        })
      });
      
      if (res.ok) {
        alert('授業を削除しました');
        closeCourseModal();
        await initializeTimetable(); // 時間割を再描画
      } else {
        alert('削除に失敗しました');
      }
    }

    // モーダルのボタンにイベントを割り当て
    document.getElementById('modalSaveBtn').onclick = saveCourse;
    document.getElementById('modalDeleteBtn').onclick = deleteCourse;
    document.getElementById('modalCancelBtn').onclick = closeCourseModal;

    // テーマ切替のロジック
    const tt=document.getElementById('themeToggle');
    function applyTheme(t){
      document.documentElement.setAttribute('data-theme',t);
      tt.textContent=t==='dark'?'☀️':'🌙';
      localStorage.setItem('coma_theme',t);
    }
    tt.addEventListener('click',()=>applyTheme(
      document.documentElement.getAttribute('data-theme')==='light'?'dark':'light'
    ));
    applyTheme(localStorage.getItem('coma_theme')||'light');

    // ★★★ 初期ロード ★★★
    initializeTimetable();
  </script>
</body>
</html>
