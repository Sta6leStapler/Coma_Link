<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>マイページ | Coma‑Link</title>
  <style>
    :root { --bg: #f9f9f9; --fg: #333; --panel: #fff; --border: #ddd; --highlight: #b2fab4; --primary: #2196f3; --shadow: rgba(0,0,0,0.1); }
    html[data-theme="dark"] { --bg: #2b2b2b; --fg: #ddd; --panel: #3b3b3b; --border: #555; --highlight: #4caf50; --primary: #1976d2; --shadow: rgba(0,0,0,0.3); }
    *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
    body { font-family: Arial, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; display: flex; flex-direction: column; }

    header { background: var(--panel); padding: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    header h1 { font-size: 1.2em; margin:0; }
    .header-controls { display: flex; align-items: center; gap: 8px; }
    .header-controls button { background: none; border: none; cursor: pointer; font-size: 18px; color: var(--fg); }
    .header-controls button.logout { font-size: 14px; padding: 4px 8px; background: var(--primary); color: #fff; border-radius: 4px; }

    .toolbar { display: flex; background: var(--panel); border-bottom: 1px solid var(--border); }
    .toolbar button { flex: 1; padding: 12px; background: var(--panel); border: none; cursor: pointer; font-size: 14px; border-bottom: 3px solid transparent; }
    .toolbar button.active { border-bottom: 3px solid var(--primary); color: var(--primary); font-weight: bold; }

    main { flex: 1; padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; }
    h2 { margin-top: 30px; margin-bottom: 15px; border-left: 5px solid var(--primary); padding-left: 10px; font-size: 1.2em; }
    
    /* カードグリッドレイアウト */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
    
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 15px; box-shadow: 0 2px 4px var(--shadow); }
    .card h3 { font-size: 1.1em; margin-bottom: 8px; color: var(--primary); }
    .card p { font-size: 0.9em; margin-bottom: 5px; color: var(--fg); }
    .card .meta { font-size: 0.8em; color: #666; margin-top: 10px; }
    .status-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.8em; color: white; }
    .status-pending { background: #ffa726; }
    .status-approved { background: #66bb6a; }
    .status-rejected { background: #ef5350; }

    table { width: 100%; border-collapse: collapse; background: var(--panel); margin-bottom: 10px; }
    th, td { border: 1px solid var(--border); padding: 8px; text-align: center; }
    th { background: rgba(0,0,0,0.05); }
  </style>
</head>
<body>
  <header>
    <h1>Coma‑Link</h1>
    <div class="header-controls">
      <button id="themeToggle">🌙</button>
      <button class="logout" id="logoutBtn">ログアウト</button>
    </div>
  </header>

  <div class="toolbar">
    <button onclick="location.href='jikanwari.html'">時間割</button>
    <button onclick="location.href='board.html'">募集掲示板</button>
    <button class="active">マイページ</button>
  </div>

  <main>
    <div style="text-align:center; margin-bottom:20px;">
      <h1>ようこそ、<span id="userName"></span> さん！</h1>
    </div>

    <section>
      <h2>📝 作成した募集</h2>
      <div id="createdList" class="grid">読み込み中...</div>
    </section>

    <section>
      <h2>🙋 参加申請中の募集</h2>
      <div id="joinedList" class="grid">読み込み中...</div>
    </section>

    <section>
      <h2>📩 あなたの募集への応募</h2>
      <table id="applicationTable">
        <thead><tr><th>募集タイトル</th><th>申請者</th><th>操作</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section>
      <h2>🏫 今日の授業</h2>
      <table id="ttTable">
        <thead><tr><th>限</th><th>授業名</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script>
    const user = localStorage.getItem('coma_user');
    if (!user) { alert('ログインしてください'); location.href = 'index.html'; }
    document.getElementById('userName').textContent = user;
    document.getElementById('logoutBtn').onclick = () => { localStorage.removeItem('coma_user'); location.href = 'index.html'; };

    const API = 'https://coma-link.onrender.com';

    // --- データ読み込み ---
    async function loadAllData() {
      // 1. My Page Data (Created & Joined)
      const res1 = await fetch(`${API}/my_page_data?username=${encodeURIComponent(user)}`);
      const data = await res1.json();
      renderCreated(data.created || []);
      renderJoined(data.joined || []);

      // 2. Applications (Received)
      const res2 = await fetch(`${API}/my_recruitments/applications?username=${encodeURIComponent(user)}`);
      const apps = await res2.json();
      renderApplications(apps);

      // 3. Today's Courses
      const res3 = await fetch(`${API}/courses?username=${encodeURIComponent(user)}`);
      const courses = await res3.json();
      renderTodayCourses(courses);
    }

    function renderCreated(list) {
      const el = document.getElementById('createdList');
      if(list.length === 0) { el.innerHTML = '<p>作成した募集はありません。</p>'; return; }
      el.innerHTML = list.map(item => `
        <div class="card">
          <h3>${item.title}</h3>
          <p>📅 ${item.date} (${item.day}) ${item.start_slot}-${item.end_slot}限</p>
          <p>📍 ${item.location || '-'}</p>
          <div class="meta">作成日: ${item.created_at.split('T')[0]}</div>
        </div>
      `).join('');
    }

    function renderJoined(list) {
      const el = document.getElementById('joinedList');
      if(list.length === 0) { el.innerHTML = '<p>参加申請した募集はありません。</p>'; return; }
      el.innerHTML = list.map(item => `
        <div class="card">
          <h3>${item.title}</h3>
          <p>📅 ${item.date} (${item.day}) ${item.start_slot}-${item.end_slot}限</p>
          <p>📍 ${item.location || '-'}</p>
          <div style="margin-top:5px;">
            <span class="status-badge status-${item.status}">
              ${item.status === 'approved' ? '承認済' : item.status === 'rejected' ? '却下' : '申請中'}
            </span>
          </div>
        </div>
      `).join('');
    }

    function renderApplications(list) {
      const tbody = document.querySelector('#applicationTable tbody');
      if(list.length === 0) { tbody.innerHTML = '<tr><td colspan="3">新しい申請はありません</td></tr>'; return; }
      tbody.innerHTML = list.map(app => `
        <tr id="app-row-${app.id}">
          <td>${app.title}</td>
          <td>${app.applicant_username}</td>
          <td>
            <button onclick="handleApp(${app.id}, 'approved')">承認</button>
            <button onclick="handleApp(${app.id}, 'rejected')">却下</button>
          </td>
        </tr>
      `).join('');
    }
    
    async function handleApp(id, status) {
      await fetch(`${API}/applications/${id}`, { method: 'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({status}) });
      document.getElementById(`app-row-${id}`).remove();
    }

    function renderTodayCourses(list) {
      const jpWeek = ['日','月','火','水','木','金','土'];
      const todayJP = jpWeek[new Date().getDay()];
      const todayList = list.filter(c => c.day === todayJP);
      const tbody = document.querySelector('#ttTable tbody');
      
      if(todayList.length === 0) { 
        tbody.innerHTML = '<tr><td colspan="2">今日の授業はありません</td></tr>'; 
        return; 
      }
      
      // スロット順に並べ替え
      todayList.sort((a,b) => a.slot - b.slot);

      tbody.innerHTML = todayList.map(c => {
        let label = '';
        const s = c.slot;
        // jikanwari.htmlと同じロジック
        if (s === 3) label = '昼休み';
        else if (s < 3) label = `${s}限`;
        else label = `${s - 1}限`; // 4→3限, 5→4限...
        
        return `<tr><td>${label}</td><td>${c.content}</td></tr>`;
      }).join('');
    }

    // テーマ設定
    const tt=document.getElementById('themeToggle');
    function applyTheme(t){ document.documentElement.setAttribute('data-theme',t); tt.textContent=t==='dark'?'☀️':'🌙'; localStorage.setItem('coma_theme',t); }
    tt.addEventListener('click',()=>applyTheme(document.documentElement.getAttribute('data-theme')==='light'?'dark':'light'));
    applyTheme(localStorage.getItem('coma_theme')||'light');

    loadAllData();
  </script>
</body>
</html>
