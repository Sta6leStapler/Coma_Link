<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>募集掲示板 | Coma‑Link</title>
  <style>
    /* mypage.htmlのスタイルを参考にしています */
    :root { --bg: #f9f9f9; --fg: #333; --panel: #fff; --border: #ddd; --highlight: #b2fab4; --primary: #2196f3; --tag-bg: #e0e0e0; }
    html[data-theme="dark"] { --bg: #2b2b2b; --fg: #ddd; --panel: #3b3b3b; --border: #555; --highlight: #4caf50; --primary: #1976d2; --tag-bg: #4f4f4f; }
    
    body { font-family: Arial, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 0; }
    header { background: var(--panel); padding: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    header h1 { font-size: 1.2em; }
    header button { background: none; border: none; cursor: pointer; font-size: 18px; color: var(--fg); }
    .toolbar { display: flex; background: var(--panel); border-bottom: 1px solid var(--border); }
    .toolbar button { flex: 1; padding: 8px; background: var(--panel); border: none; cursor: pointer; font-size: 14px; }
    .toolbar button.active { background: var(--highlight); color: #fff; }
    main { padding: 20px; max-width: 800px; margin: 0 auto; }

    .filter-container { background: var(--panel); padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border); }
    .cat-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .cat-btn { padding: 6px 12px; border: 1px solid var(--border); background: var(--bg); border-radius: 20px; cursor: pointer; color: var(--fg); }
    .cat-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    
    .search-row { display: flex; gap: 10px; }
    .search-row input { flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--fg); }
    .search-row button { padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer; }

    .create-link { display: block; background: var(--panel); border: 2px dashed var(--primary); color: var(--primary); text-align: center; padding: 15px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-bottom: 20px; }
    .create-link:hover { background: rgba(33, 150, 243, 0.1); }

    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 15px; position: relative; }
    .card h3 { margin: 0 0 10px 0; color: var(--primary); font-size: 1.1em; }
    .card-meta { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.9em; color: var(--fg); opacity: 0.9; margin-bottom: 10px; }
    .tag { background: var(--tag-bg); padding: 3px 8px; border-radius: 4px; font-size: 0.8em; }
    
    .action-area { display: flex; justify-content: flex-end; align-items: center; margin-top: 10px; }
    .status-text { font-size: 0.9em; font-weight: bold; color: #999; margin-right: 10px; }
    .apply-btn { padding: 8px 16px; background: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer; }
    .apply-btn:disabled { background: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>Coma‑Link</h1>
    <button id="themeToggle">🌙</button>
  </header>

  <div class="toolbar">
    <button onclick="location.href='jikanwari.html'">時間割</button>
    <button onclick="location.href='board.html'" class="active">募集掲示板</button>
    <button onclick="location.href='mypage.html'">マイページ</button>
  </div>

  <main>
    <div class="filter-section" style="flex-direction:column; align-items:flex-start;">
      <div style="margin-bottom:10px;">カテゴリで絞り込み:</div>
      <div id="category-filters" style="display:flex; gap:5px; flex-wrap:wrap;">
        <button onclick="filterByCategory('')" class="cat-btn active">全て</button>
        </div>
      <!-- 追加: 検索欄と検索ボタン -->
      <div style="margin-top:8px; display:flex; gap:8px;">
        <input id="filterLocation" placeholder="場所で絞る (任意)" />
        <button id="filterBtn">検索</button>
      </div>
    </div>

    <a href="create_recruitment.html" class="create-btn">＋ 新しい募集を作成する</a>

    <div id="recruitment-list">
      </div>
  </main>

  <script>
    const API = 'https://coma-link.onrender.com';
    const user = localStorage.getItem('coma_user');
    if (!user) {
      alert('ログインしてください');
      location.href = 'index.html';
    }

    const recruitmentList = document.getElementById('recruitment-list');
    // const filterCategory = document.getElementById('filterCategory');
    // const filterLocation = document.getElementById('filterLocation');

    // URLからパラメータを取得
    const urlParams = new URLSearchParams(window.location.search);
    const dayParam = urlParams.get('day');
    const slotParam = urlParams.get('slot');

    const CATEGORIES = ["食事", "勉強", "スポーツ", "雑談", "趣味", "その他"];
    let currentCategory = '';

    // カテゴリボタン生成
    const catContainer = document.getElementById('category-filters');
    CATEGORIES.forEach(cat => {
        const btn = document.createElement('button');
        btn.textContent = cat;
        btn.className = 'cat-btn';
        btn.onclick = () => filterByCategory(cat);
        catContainer.appendChild(btn);
    });

    function filterByCategory(cat) {
        currentCategory = cat;
        // UI更新 (activeクラスの付け替えなど)
        loadRecruitments();
    }

    // 募集一覧を読み込んで表示する関数
    async function loadRecruitments() {
      const params = new URLSearchParams();
      params.append('viewer', user); // 自分の状態を知るために必要

      if (currentCategory) params.append('category', currentCategory);
      
      const locInput = document.getElementById('filterLocation');
      if (locInput && locInput.value) params.append('location', locInput.value);
      
      if (dayParam && slotParam) {
        params.append('day', dayParam);
        params.append('slot', slotParam);
      }
      
      try {
        const res = await fetch(`${API}/recruitments?${params.toString()}`);
        if(!res.ok) throw new Error(res.status);
        const recruitments = await res.json();
        
        recruitmentList.innerHTML = '';
        if (recruitments.length === 0) {
          recruitmentList.innerHTML = '<p style="text-align:center; color:#888;">条件に一致する募集はありません。</p>';
          return;
        }

        recruitments.forEach(rec => {
          const isMine = (rec.creator_username === user);
          const status = rec.my_status;
          
          const card = document.createElement('div');
          card.className = 'card';
          
          let actionHtml = '';
          if (isMine) {
            actionHtml = `<span class="status-text" style="color:var(--primary);">あなたが作成した募集</span>`;
          } else if (status) {
            const label = status==='pending'?'申請中':(status==='approved'?'承認済':'却下');
            actionHtml = `<button class="apply-btn" disabled>${label}</button>`;
          } else {
            actionHtml = `<button class="apply-btn" onclick="applyToRecruitment(${rec.id})">参加申請</button>`;
          }

          card.innerHTML = `
            <h3>${rec.title}</h3>
            <div class="card-meta">
              <span class="tag">👤 ${rec.creator_username}</span>
              <span class="tag">📁 ${rec.category || 'その他'}</span>
              <span class="tag">📍 ${rec.location || '未定'}</span>
              <span class="tag">⏰ ${rec.day}曜 ${rec.start_slot}〜${rec.end_slot}限</span>
              <span class="tag">👥 定員 ${rec.max_participants}名</span>
            </div>
            <div class="action-area">
              ${actionHtml}
            </div>
          `;
          recruitmentList.appendChild(card);
        });
      } catch (e) {
          console.error("募集読み込みエラー", e);
          recruitmentList.innerHTML = '<p style="text-align:center; color:red;">読み込みに失敗しました。</p>';
      }
    }

    // 参加申請を行う関数
    async function applyToRecruitment(recId) {
      if (!confirm('この募集に参加申請しますか？')) return;
+      try {
+        const res = await fetch(`${API}/recruitments/${recId}/apply`, {
+          method: 'POST',
+          headers: { 'Content-Type': 'application/json' },
+          body: JSON.stringify({ applicant_username: user })
+        });
+        if (!res.ok) {
+          const txt = await res.text().catch(()=>null);
+          throw new Error(txt || `HTTP ${res.status}`);
+        }
+        const data = await res.json().catch(()=>({success:false, message:'invalid response'}));
+        if (data.success) {
+          alert('参加申請を送りました！');
+        } else {
+          alert('エラーが発生しました: ' + (data.message || '不明なエラー'));
+        }
+      } catch (e) {
+        console.error(e);
+        alert('参加申請に失敗しました: ' + (e.message || e));
+      }
    }
    
    // 「検索」ボタンクリックで再読み込み
    const filterBtnEl = document.getElementById('filterBtn');
    if (filterBtnEl) filterBtnEl.addEventListener('click', loadRecruitments);
    
    // テーマ切替のロジック (mypage.htmlからコピー)
    const tt = document.getElementById('themeToggle');
    function applyTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      tt.textContent = t === 'light' ? '🌙' : '☀️';
      localStorage.setItem('coma_theme', t);
    }
    tt.addEventListener('click', () => {
      applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
    });
    applyTheme(localStorage.getItem('coma_theme') || 'light');

    // 初期読み込み
    loadRecruitments();
  </script>
</body>
</html>
